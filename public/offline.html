<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f0d0a">
    <title>Cazera Offline</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f0d0a;
            color: #f8fafc;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            max-width: 440px;
            text-align: center;
        }

        .mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            background: #d7b56d;
            color: #0f0d0a;
            font-weight: 900;
            font-size: 24px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.15;
        }

        p {
            margin: 14px 0 0;
            color: #cbd5e1;
            line-height: 1.65;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark">CZ</div>
        <h1>You are offline</h1>
        <p>Cazera needs a network connection for live backoffice and POS data. Reconnect and refresh to continue.</p>
    </main>
</body>
</html>
